name: Check Upstream Changes

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nuon-plugin
        uses: actions/checkout@v4

      - name: Detect upstream changes
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT=$(bash .maintainer/scripts/detect-changes.sh 2>/tmp/detect-stderr.txt)
          cat /tmp/detect-stderr.txt

          TOTAL=$(echo "$OUTPUT" | jq -r '.total_changes')
          echo "total_changes=$TOTAL" >> "$GITHUB_OUTPUT"

          if [ "$TOTAL" -gt 0 ]; then
            echo "changes_detected=true" >> "$GITHUB_OUTPUT"
            # Save report for issue body
            echo "$OUTPUT" | jq -r '.report' > /tmp/report.md
          else
            echo "changes_detected=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close stale upstream-sync issues
        if: steps.detect.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue list --label "upstream-sync" --state open --json number -q '.[].number' | \
            xargs -I {} gh issue close {} --comment "Superseded by newer detection run." || true

      - name: Create issue for detected changes
        if: steps.detect.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Upstream changes detected: $(date +%Y-%m-%d)" \
            --body "$(cat <<'EOF'
          ## Upstream Nuon Changes Detected

          The daily upstream check found changes in tracked files that may require
          plugin updates.

          $(cat /tmp/report.md)

          ## Next Steps

          1. Open the nuon-plugin repo in Claude Code
          2. Ask Claude: "Check for upstream Nuon changes and update the plugin"
          3. Review and commit the proposed changes

          ---
          *Generated by the upgrade-check workflow*
          EOF
          )" \
            --label "upstream-sync"

      - name: Summary
        run: |
          if [ "${{ steps.detect.outputs.changes_detected }}" = "true" ]; then
            echo "### Upstream changes detected" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.detect.outputs.total_changes }} tracked files changed." >> "$GITHUB_STEP_SUMMARY"
            echo "A GitHub issue has been created." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No upstream changes" >> "$GITHUB_STEP_SUMMARY"
            echo "All tracked files match the baseline." >> "$GITHUB_STEP_SUMMARY"
          fi
